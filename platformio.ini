; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = clock, c3_clock, c3_retro_night, c3_retro_day, displaytest, c3_displaytest

[base]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.4
extra_scripts = post:scripts/export_firmware.py
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MISO=-1
	
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1

[s3]
extends = base
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
build_flags = 
	${base.build_flags}
	
	-D USE_HSPI_PORT
	
	-D TFT_MOSI=6
	-D TFT_SCLK=4
	-D TFT_CS=7
	-D TFT_DC=2
	-D TFT_RST=3
	
	-D SPI_FREQUENCY=40000000

[c3]
extends = base
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
extra_scripts = 
	pre:scripts/patch_tft_c3.py
	post:scripts/export_firmware.py
build_flags = 
	${base.build_flags}
	
	
	-D TFT_SCLK=4
	-D TFT_MOSI=6
	-D TFT_CS=7
	-D TFT_DC=2
	-D TFT_RST=3
	-D BOOT_BTN=9
	-D AUTO_SLEEP_TIMEOUT_MS=15000
	
	-D SPI_FREQUENCY=40000000

[env:clock]
extends = s3
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:c3_clock]
extends = c3
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:preview]
extends = s3
extra_scripts = 
build_flags = ${s3.build_flags} -D FORCE_FACE=${sysenv.PREVIEW_FACE}
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:c3_preview]
extends = c3
extra_scripts = pre:scripts/patch_tft_c3.py
build_flags = ${c3.build_flags} -D FORCE_FACE=${sysenv.PREVIEW_FACE}
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:c3_retro_night]
extends = c3
extra_scripts = pre:scripts/patch_tft_c3.py
build_flags = ${c3.build_flags} -D FORCE_NIGHT
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:c3_retro_day]
extends = c3
extra_scripts = pre:scripts/patch_tft_c3.py
build_flags = ${c3.build_flags} -D FORCE_DAY
build_src_filter = +<*> -<tools/> -<c6/>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:displaytest]
extends = s3
build_flags = ${s3.build_flags} -D SPI_FREQUENCY=10000000
build_src_filter = +<tools/display_test.cpp>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

[env:c3_displaytest]
extends = c3
build_flags = ${c3.build_flags} -D SPI_FREQUENCY=10000000
build_src_filter = +<tools/display_test.cpp>
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43
